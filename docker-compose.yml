services:
  web:
    image: nginx:alpine
    container_name: lan-dm-web
    ports:
      - "${WEB_PORT:-8088}:80"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    image: node:20-alpine
    container_name: lan-dm-backend
    working_dir: /app
    command: node index.js
    environment:
      - PORT=${PORT:-3001}
      - DATA_DIR=/data
      - COLLECTOR_KEY=${COLLECTOR_KEY}
      - NAS_IP=${NAS_IP:-}
    volumes:
      - ./server:/app:ro
      - ${DATA_DIR:-./server-data}:/data
    restart: unless-stopped

  collector:
    build: ./collector
    container_name: lan-dm-collector
    environment:
      - PLATFORM=http://${SERVER_IP}:${WEB_PORT:-8088}
      - COLLECTOR_KEY=${COLLECTOR_KEY}
      - COLLECTOR_INTERVAL=${COLLECTOR_INTERVAL:-600}
      - COLLECTOR_POLL=${COLLECTOR_POLL:-5}
      - ROUTER_URL=${ROUTER_URL}
      - ROUTER_USER=${ROUTER_USER}
      - ROUTER_PASS=${ROUTER_PASS}
    depends_on:
      - backend
    restart: unless-stopped
